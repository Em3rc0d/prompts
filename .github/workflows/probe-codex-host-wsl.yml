name: Probe Codex Host on WSL — Local Only

# Capability-only probe. Runs on the user's WSL self-hosted runner.
# It never performs a model call and never uploads an artifact to GitHub.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/codex-host-probe-trigger'
      - '.github/workflows/probe-codex-host-wsl.yml'

permissions:
  contents: read

jobs:
  probe-host-local-only:
    runs-on: [self-hosted, Linux, X64, vigia]
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Probe local WSL surface without model use
        shell: bash
        run: |
          set -euo pipefail

          if grep -qiE 'microsoft|wsl' /proc/version 2>/dev/null; then
            is_wsl=true
          else
            is_wsl=false
          fi

          if command -v codex >/dev/null 2>&1; then
            codex_present=true
            codex_version="$(codex --version 2>&1 | head -n 1 | tr -d '\r')"
            exec_help="$(codex exec --help 2>&1 || true)"
          else
            codex_present=false
            codex_version="NOT_INSTALLED"
            exec_help=""
          fi

          flag_ephemeral=false
          flag_json=false
          flag_model=false
          flag_output_last_message=false
          if printf '%s' "$exec_help" | grep -q -- '--ephemeral'; then flag_ephemeral=true; fi
          if printf '%s' "$exec_help" | grep -q -- '--json'; then flag_json=true; fi
          if printf '%s' "$exec_help" | grep -q -- '--model'; then flag_model=true; fi
          if printf '%s' "$exec_help" | grep -q -- '--output-last-message'; then flag_output_last_message=true; fi

          # Do not read or export auth material. Only observe whether local files exist.
          auth_file_present=false
          if test -f "$HOME/.codex/auth.json"; then auth_file_present=true; fi

          # Clean-surface contamination check: only search for N09/evaluation markers.
          # Contents never leave the machine.
          global_agents_present=false
          global_agents_n09_markers=false
          if test -f "$HOME/.codex/AGENTS.md"; then
            global_agents_present=true
            if grep -qiE 'PM-STARTER-CR-NORMAL-0001|expected_state|blocking_dimensions|assessment_answer_key|evaluation contract' "$HOME/.codex/AGENTS.md"; then
              global_agents_n09_markers=true
            fi
          fi

          python_version="$(python3 --version 2>&1 | tr -d '\r')"
          git_version="$(git --version 2>&1 | tr -d '\r')"
          node_version="$(node --version 2>/dev/null | tr -d '\r' || true)"

          LOCAL_ROOT="${PM_LOCAL_EVIDENCE_ROOT:-$HOME/.local/share/prompt-machine}"
          OUT_DIR="$LOCAL_ROOT/probes/codex-host"
          mkdir -p "$OUT_DIR"
          OUT_FILE="$OUT_DIR/${GITHUB_SHA}.json"

          CODEX_PRESENT="$codex_present" \
          CODEX_VERSION="$codex_version" \
          IS_WSL="$is_wsl" \
          AUTH_FILE_PRESENT="$auth_file_present" \
          FLAG_EPHEMERAL="$flag_ephemeral" \
          FLAG_JSON="$flag_json" \
          FLAG_MODEL="$flag_model" \
          FLAG_OUTPUT_LAST_MESSAGE="$flag_output_last_message" \
          GLOBAL_AGENTS_PRESENT="$global_agents_present" \
          GLOBAL_AGENTS_N09_MARKERS="$global_agents_n09_markers" \
          PYTHON_VERSION="$python_version" \
          GIT_VERSION="$git_version" \
          NODE_VERSION="$node_version" \
          GITHUB_SHA_VALUE="$GITHUB_SHA" \
          OUT_FILE="$OUT_FILE" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = {
              "schema": "prompt-machine-local-wsl-codex-capability-probe-v2",
              "source_commit": os.environ["GITHUB_SHA_VALUE"],
              "execution_location": "USER_WSL_SELF_HOSTED_RUNNER",
              "required_labels": ["self-hosted", "Linux", "X64", "vigia"],
              "wsl_detected": os.environ["IS_WSL"] == "true",
              "codex": {
                  "present": os.environ["CODEX_PRESENT"] == "true",
                  "version": os.environ["CODEX_VERSION"],
                  "chatgpt_auth_file_present": os.environ["AUTH_FILE_PRESENT"] == "true",
                  "exec_flags": {
                      "ephemeral": os.environ["FLAG_EPHEMERAL"] == "true",
                      "json": os.environ["FLAG_JSON"] == "true",
                      "model": os.environ["FLAG_MODEL"] == "true",
                      "output_last_message": os.environ["FLAG_OUTPUT_LAST_MESSAGE"] == "true",
                  },
              },
              "clean_surface": {
                  "global_agents_present": os.environ["GLOBAL_AGENTS_PRESENT"] == "true",
                  "n09_or_evaluation_markers_detected_in_global_agents": os.environ["GLOBAL_AGENTS_N09_MARKERS"] == "true",
              },
              "tools": {
                  "python": os.environ["PYTHON_VERSION"],
                  "git": os.environ["GIT_VERSION"],
                  "node": os.environ["NODE_VERSION"] or None,
              },
              "credential_contents_read": False,
              "model_call_made": False,
              "network_model_execution_attempted": False,
              "github_artifact_uploaded": False,
              "local_evidence_path": os.environ["OUT_FILE"],
              "behavioral_claim": "NONE",
          }
          path = Path(os.environ["OUT_FILE"])
          path.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(out, indent=2, sort_keys=True))
          print(f"LOCAL_ONLY_REPORT={path}")
          PY

      - name: Assert no cloud artifact publication
        shell: bash
        run: |
          set -euo pipefail
          echo 'LOCAL ONLY: no actions/upload-artifact step exists in this workflow.'
