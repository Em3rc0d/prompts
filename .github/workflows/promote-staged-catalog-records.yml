name: Promote Staged Catalog Records

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/catalog-promotion-trigger'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Promote staged records idempotently
        run: |
          python tools/promote_catalog_records.py \
            catalog/catalog.jsonl \
            quarry/promotions/alpacka-derived-20260826.jsonl

      - name: Validate catalog
        run: python tools/validate_catalog.py

      - name: Commit promoted catalog
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add catalog/catalog.jsonl
          if git diff --cached --quiet; then
            echo 'No catalog promotion changes to commit.'
            exit 0
          fi
          git commit -m 'catalog: promote Alpacka-derived reusable artifacts'
          git pull --rebase origin main
          python tools/validate_catalog.py
          git push origin HEAD:main
