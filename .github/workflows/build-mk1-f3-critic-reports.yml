name: Build MK1 F3 Critic Reports

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/mk1-f3-build-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Re-run F1 guardrails
        run: python tools/test_mk1_f1.py

      - name: Re-run F2 assembler characterization
        run: python tools/test_mk1_f2.py

      - name: Re-run F3 semantic critic characterization
        run: python tools/test_mk1_f3.py

      - name: Build F3 critic receipts
        run: python tools/mk1_build_f3_critic_reports.py --source mk1/candidates/f2 --output mk1/candidates/f3

      - name: Validate exact F3 receipt binding
        run: python tools/validate_mk1_f3_repository.py

      - name: Validate canonical quarry
        run: python tools/validate_catalog.py

      - name: Commit F3 critic receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add mk1/candidates/f3
          if git diff --cached --quiet; then
            echo 'No F3 critic receipt changes to commit.'
            exit 0
          fi
          git commit -m 'mk1: materialize F3 static critic receipts'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python tools/validate_catalog.py >/dev/null
            python tools/test_mk1_f1.py >/dev/null
            python tools/test_mk1_f2.py >/dev/null
            python tools/test_mk1_f3.py >/dev/null
            python tools/validate_mk1_f3_repository.py >/dev/null
            if git push origin HEAD:main; then
              echo 'Published MK1 F3 critic receipts.'
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'Failed to publish MK1 F3 critic receipts after retries.' >&2
          exit 1
