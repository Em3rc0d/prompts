name: Build MK1 F3 Critic Reports

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/mk1-f3-build-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Re-run F1 guardrails
        run: python tools/test_mk1_f1.py

      - name: Re-run F2 assembler characterization
        run: python tools/test_mk1_f2.py

      - name: Re-run F3 semantic critic characterization
        run: python tools/test_mk1_f3.py

      - name: Build F3 critic receipts
        run: python tools/mk1_build_f3_critic_reports.py --source mk1/candidates/f2 --output mk1/candidates/f3

      - name: Validate F3 receipt bundle
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('mk1/candidates/f3')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['mk_stage'] == 'MK1', manifest
          assert manifest['phase'] == 'F3', manifest
          assert manifest['status'] == 'STATIC_CRITIC_PASS', manifest
          assert manifest['report_count'] == 3, manifest
          assert 'does not advance artifact state beyond VALID' in manifest['state_policy'], manifest
          assert (root / 'INDEX.txt').exists(), root

          for row in manifest['reports']:
              assert row['artifact_state'] == 'VALID', row
              assert row['critic_status'] == 'PASS', row
              assert row['blocking'] == 0, row
              assert row['errors'] == 0, row
              assert Path(row['critic_json']).exists(), row
              assert Path(row['critic_txt']).exists(), row

              critic = json.loads(Path(row['critic_json']).read_text(encoding='utf-8'))
              assert critic['status'] == 'PASS', critic
              assert critic['counts']['blocking'] == 0, critic
              assert critic['counts']['error'] == 0, critic

          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Validate canonical quarry
        run: python tools/validate_catalog.py

      - name: Commit F3 critic receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add mk1/candidates/f3
          if git diff --cached --quiet; then
            echo 'No F3 critic receipt changes to commit.'
            exit 0
          fi
          git commit -m 'mk1: materialize F3 static critic receipts'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python tools/validate_catalog.py
            python tools/test_mk1_f1.py >/dev/null
            python tools/test_mk1_f2.py >/dev/null
            python tools/test_mk1_f3.py >/dev/null
            if git push origin HEAD:main; then
              echo 'Published MK1 F3 critic receipts.'
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'Failed to publish MK1 F3 critic receipts after retries.' >&2
          exit 1
