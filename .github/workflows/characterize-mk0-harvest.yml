name: Characterize MK0 Harvest Batch 001

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mk1-prompt-generator-v0-20260827
    paths:
      - tools/mk0_characterize_harvest.py
      - tools/mk0_harvester_router.py
      - mk0/harvester/POLICY.json
      - mk0/harvester/CANDIDATE_RECORD.schema.json
      - mk0/normalized/harvester/source-records.jsonl
      - .github/workflows/characterize-mk0-harvest.yml

permissions:
  contents: write

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Characterize 183 observations
        run: python tools/mk0_characterize_harvest.py
      - name: Enforce characterization invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('mk0/analysis/harvester/characterization-batch-001-receipt.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['records'] == 183, receipt
          assert sum(receipt['routes'].values()) == 183, receipt
          print(json.dumps(receipt, indent=2))
          PY
      - name: Commit candidate queue and receipt
        run: |
          git config user.name "prompt-quarry-bot"
          git config user.email "prompt-quarry-bot@users.noreply.github.com"
          git add mk0/golden-dataset/candidate-queue/batch-001.jsonl mk0/analysis/harvester/characterization-batch-001-receipt.json
          if git diff --cached --quiet; then
            echo "No characterization changes"
          else
            git commit -m "data(mk0): characterize live harvest batch 001"
            git push
          fi
