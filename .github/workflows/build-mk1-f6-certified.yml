name: Build MK1 F6 Certified Artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/mk1-f6-build-trigger'
      - 'mk1/receipts/f6/**/*.receipt.json'
      - 'mk1/candidates/f5/**'

permissions:
  contents: write

jobs:
  build-certified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate canonical quarry
        run: python tools/validate_catalog.py
      - name: Re-run F1
        run: python tools/test_mk1_f1.py
      - name: Re-run F2
        run: python tools/test_mk1_f2.py
      - name: Re-run F3
        run: python tools/test_mk1_f3.py
      - name: Validate exact F3 binding
        run: python tools/validate_mk1_f3_repository.py
      - name: Validate MK0 provenance
        run: python tools/validate_mk1_fixture_provenance.py
      - name: Re-run F4
        run: python tools/test_mk1_f4.py
      - name: Validate persisted F4 boundary
        run: python tools/validate_mk1_f4_repository.py
      - name: Re-run F5
        run: python tools/test_mk1_f5.py
      - name: Validate persisted F5 boundary
        run: python tools/validate_mk1_f5_repository.py
      - name: Re-run F6 target-runtime characterization
        run: python tools/test_mk1_f6.py
      - name: Materialize F6 state
        run: |
          python tools/mk1_materialize_f6_certified.py \
            --source mk1/candidates/f5 \
            --evidence mk1/receipts/f6 \
            --fixtures mk1/fixtures/f4/fixture-sets.json \
            --output mk1/candidates/f6
      - name: Validate durable F6 boundary
        run: python tools/validate_mk1_f6_repository.py
      - name: Commit F6 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add mk1/candidates/f6
          if git diff --cached --quiet; then
            echo 'No F6 state changes to commit.'
            exit 0
          fi
          git commit -m 'mk1: materialize F6 target-runtime certification state'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python tools/validate_catalog.py >/dev/null
            python tools/test_mk1_f1.py >/dev/null
            python tools/test_mk1_f2.py >/dev/null
            python tools/test_mk1_f3.py >/dev/null
            python tools/validate_mk1_f3_repository.py >/dev/null
            python tools/validate_mk1_fixture_provenance.py >/dev/null
            python tools/test_mk1_f4.py >/dev/null
            python tools/validate_mk1_f4_repository.py >/dev/null
            python tools/test_mk1_f5.py >/dev/null
            python tools/validate_mk1_f5_repository.py >/dev/null
            python tools/test_mk1_f6.py >/dev/null
            python tools/validate_mk1_f6_repository.py >/dev/null
            if git push origin HEAD:main; then
              echo 'Published MK1 F6 certification state.'
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'Failed to publish MK1 F6 state after retries.' >&2
          exit 1
