name: Mine Alpacka Free Prompt Techniques

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/free-technique-mining-trigger'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Mine public free prompt techniques in memory
        run: |
          python tools/mine_free_prompt_techniques.py \
            quarry/normalized/alpacka-ai-prompt-metadata.jsonl \
            --output quarry/analysis/alpacka-ai-free-technique-vectors.jsonl \
            --matrix quarry/analysis/alpacka-ai-free-technique-matrix.json \
            --delay-ms 150

      - name: Validate quarry
        run: python tools/validate_catalog.py

      - name: Commit technique vectors
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add quarry/analysis/alpacka-ai-free-technique-vectors.jsonl quarry/analysis/alpacka-ai-free-technique-matrix.json
          if git diff --cached --quiet; then
            echo 'No technique-mining changes to commit.'
            exit 0
          fi
          git commit -m 'data: mine Alpacka free prompt technique vectors'
          git pull --rebase origin main
          python tools/validate_catalog.py
          git push origin HEAD:main
