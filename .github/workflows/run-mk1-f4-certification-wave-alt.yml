name: Run MK1 F4 Certification Wave Alt Providers

on:
  push:
    paths:
      - '.github/mk1-certification-wave-alt-trigger'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            model: claude-sonnet-5
            family: anthropic-claude-sonnet-5
            artifact_slug: content_clear_rewrite
          - provider: anthropic
            model: claude-sonnet-5
            family: anthropic-claude-sonnet-5
            artifact_slug: software_code_review
          - provider: anthropic
            model: claude-sonnet-5
            family: anthropic-claude-sonnet-5
            artifact_slug: research_technical_decision
          - provider: gemini
            model: gemini-3.7-flash
            family: google-gemini-3.7
            artifact_slug: content_clear_rewrite
          - provider: gemini
            model: gemini-3.7-flash
            family: google-gemini-3.7
            artifact_slug: software_code_review
          - provider: gemini
            model: gemini-3.7-flash
            family: google-gemini-3.7
            artifact_slug: research_technical_decision
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify selected provider credential exists
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.provider }}' in
            anthropic) test -n "${ANTHROPIC_API_KEY:-}" || { echo 'BLOCKED: ANTHROPIC_API_KEY is not configured in GitHub Actions secrets.' >&2; exit 3; } ;;
            gemini) test -n "${GEMINI_API_KEY:-}" || { echo 'BLOCKED: GEMINI_API_KEY is not configured in GitHub Actions secrets.' >&2; exit 3; } ;;
          esac
      - name: Execute frozen F4 experiment
        shell: bash
        run: |
          set -euo pipefail
          SLUG='${{ matrix.artifact_slug }}'
          PROVIDER='${{ matrix.provider }}'
          MODEL='${{ matrix.model }}'
          FAMILY='${{ matrix.family }}'
          ARTIFACT="mk1/candidates/f2/$SLUG/artifact.json"
          FIXTURE_SET="pq_mk1_fs_${SLUG}_v1"
          EXECUTION_ID="mk1-f4-${PROVIDER}-${SLUG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OUT="mk1/staging/f4/${PROVIDER}/${SLUG}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python tools/mk1_prepare_experiment.py --stage f4 --artifact "$ARTIFACT" --fixture-set "$FIXTURE_SET" --provider "$PROVIDER" --model "$MODEL" --family "$FAMILY" --execution-id "$EXECUTION_ID" --output-dir "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: Guard unresolved human review boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/execution.unreviewed.json"
          test -f "$OUT/review-packet.json"
          test ! -e "$OUT/receipt.json"
          if grep -E '"status"[[:space:]]*:[[:space:]]*"(PASS|FAIL)"' "$OUT/review-packet.json"; then exit 4; fi
      - name: Upload reviewer packet
        uses: actions/upload-artifact@v4
        with:
          name: mk1-f4-review-${{ matrix.provider }}-${{ matrix.artifact_slug }}-${{ github.run_id }}
          path: ${{ env.OUT }}/review-packet.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload operator evidence
        uses: actions/upload-artifact@v4
        with:
          name: mk1-f4-evidence-${{ matrix.provider }}-${{ matrix.artifact_slug }}-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/execution.unreviewed.json
            ${{ env.OUT }}/runtime-evidence-manifest.json
            ${{ env.OUT }}/raw/
          if-no-files-found: error
          retention-days: 30
