name: Validate MK1 ChatGPT Plus Manual Lane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/mk1_build_plus_f4_wave.py'
      - 'tools/mk1_collect_plus_f4_wave.py'
      - 'tools/test_mk1_plus_manual_lane.py'
      - 'tools/mk1_build_plus_f5_wave.py'
      - 'tools/mk1_collect_plus_f5_wave.py'
      - 'tools/mk1_finalize_plus_f5_review.py'
      - 'tools/test_mk1_plus_f5_manual_lane.py'
      - 'tools/mk1_f4_review.py'
      - 'tools/mk1_f5_finalize_review.py'
      - 'mk1/fixtures/f4/fixture-sets.json'
      - 'mk1/baselines/f5/task-equivalent-minimal.json'
      - '.github/workflows/validate-mk1-plus-manual-lane.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Plus certification tools
        run: |
          python -m py_compile tools/mk1_build_plus_f4_wave.py
          python -m py_compile tools/mk1_collect_plus_f4_wave.py
          python -m py_compile tools/mk1_build_plus_f5_wave.py
          python -m py_compile tools/mk1_collect_plus_f5_wave.py
          python -m py_compile tools/mk1_finalize_plus_f5_review.py
          python -m py_compile tools/test_mk1_plus_manual_lane.py
          python -m py_compile tools/test_mk1_plus_f5_manual_lane.py

      - name: Characterize F4 Plus lane
        run: python tools/test_mk1_plus_manual_lane.py

      - name: Characterize F5 Plus blinded lane
        run: python tools/test_mk1_plus_f5_manual_lane.py

      - name: Validate canonical repository
        run: python tools/validate_catalog.py
