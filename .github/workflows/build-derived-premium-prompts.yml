name: Build Derived Premium Prompts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/derived-premium-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build non-null repository-authored premium reconstructions
        run: |
          python tools/build_derived_premium_prompts.py \
            quarry/normalized/alpacka-ai-prompt-metadata.jsonl \
            --output library/prompts/alpacka/derived-premium/catalog.jsonl \
            --manifest library/prompts/alpacka/derived-premium/manifest.json \
            --categories-dir library/prompts/alpacka/derived-premium/categories

      - name: Validate coverage and catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('library/prompts/alpacka/derived-premium/manifest.json').read_text(encoding='utf-8'))
          assert m['premium_source_records'] == 478, m
          assert m['derived_records'] == 478, m
          assert m['empty_content_records'] == 0, m
          print('Derived premium coverage OK:', m['derived_records'])
          PY
          python tools/validate_catalog.py

      - name: Commit derived prompt library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add library/prompts/alpacka/derived-premium
          if git diff --cached --quiet; then
            echo 'No derived premium changes to commit.'
            exit 0
          fi
          git commit -m 'library: add 478 non-null premium reconstructions'

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git pull --rebase origin main
            python tools/validate_catalog.py
            if git push origin HEAD:main; then
              echo 'Published derived premium library.'
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          exit 1
