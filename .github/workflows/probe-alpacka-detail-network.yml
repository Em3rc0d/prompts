name: Probe Alpacka Detail Network

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/detail-network-trigger'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Probe one free and one premium prompt detail page
        run: |
          python tools/probe_prompt_network.py \
            'https://www.alpackaai.xyz/prompts/9a1ca7e1-1693-419b-a64c-589d48b65a10' \
            'https://www.alpackaai.xyz/prompts/26a97f02-f44a-4af2-bf8b-9bcc5770d115' \
            --output quarry/fixtures/alpacka-detail-network-probe.json
      - name: Commit sanitized fixture
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add quarry/fixtures/alpacka-detail-network-probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: capture sanitized Alpacka detail network contract'
          git pull --rebase origin main
          git push origin HEAD:main
