name: Analyze Alpacka Public Directory

on:
  workflow_dispatch:
  push:
    paths:
      - 'quarry/raw/alpacka-ai/surface/root-links.jsonl'
      - '.github/analyze-surface-trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build surface manifest
        run: |
          python tools/build_surface_manifest.py \
            quarry/raw/alpacka-ai/surface/root-links.jsonl \
            --manifest quarry/normalized/alpacka-ai-surface-manifest.json \
            --candidates quarry/normalized/alpacka-ai-public-link-candidates.jsonl

      - name: Commit analysis
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add quarry/normalized/alpacka-ai-surface-manifest.json quarry/normalized/alpacka-ai-public-link-candidates.jsonl
          if git diff --cached --quiet; then
            echo 'No surface analysis changes to commit.'
            exit 0
          fi
          git commit -m 'data: analyze Alpacka public directory'
          git pull --rebase origin main
          git push origin HEAD:main
