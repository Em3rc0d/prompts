name: Validate Trust History v1

on:
  workflow_dispatch:
  push:
    branches:
      - feat/workflow-kits-product-model-20260902
    paths:
      - 'docs/WORKFLOW_TRUST_HISTORY_V1.md'
      - 'quarry/learning-loop/TRUST_HISTORY_POLICY_V1.json'
      - 'quarry/learning-loop/TRUST_HISTORY_RECORD_TEMPLATE_V1.json'
      - 'commercial/TRUST_CARD_CONTRACT_V1.json'
      - 'quarry/etl/prompt-library-v1/manual-canary-campaign-v1/ledger.json'
      - 'quarry/etl/prompt-library-v1/manual-canary-campaign-v1/TRUST_HISTORY.md'
      - 'quarry/etl/prompt-library-v1/manual-canary-campaign-v1/TRUST_CARD_INTERNAL_V1.json'
      - 'tools/validate_trust_history_v1.py'
      - '.github/workflows/validate-trust-history-v1.yml'

permissions:
  contents: read

jobs:
  validate-trust-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/workflow-kits-product-model-20260902

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Trust History truth boundaries
        run: python tools/validate_trust_history_v1.py

      - name: Enforce zero-call and no-publication boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          card = json.loads(Path('quarry/etl/prompt-library-v1/manual-canary-campaign-v1/TRUST_CARD_INTERNAL_V1.json').read_text())
          contract = json.loads(Path('commercial/TRUST_CARD_CONTRACT_V1.json').read_text())
          assert card['publication_state'] == 'INTERNAL_DRAFT_NOT_PUBLIC'
          assert card['truth_boundary']['automatic_publication'] is False
          assert contract['current_publication_gate']['enabled'] is False
          assert contract['projection_rules']['automatic_claim_strengthening'] is False
          print('TRUST HISTORY PUBLICATION BOUNDARY: PASS')
          print('model_calls=0')
          PY

      - name: Summarize
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Prompt Machine Trust History v1

          | Signal | State |
          |---|---|
          | Policy / contract consistency | PASS |
          | Campaign observations | 7 |
          | Expected-state matches | 7 / 7 |
          | Blocking review failures | 0 |
          | Embedded-override observations | 3 |
          | Public Trust Card | BLOCKED |
          | Automatic publication | BLOCKED |
          | Automatic claim strengthening | BLOCKED |
          | Model calls created by validation | 0 |

          This job validates the evidence narrative and its claim boundaries. It does not create behavioral, certification, customer-value, portability, or commercial evidence.
          EOF
