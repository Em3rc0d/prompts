name: Build Alpacka Prompt Directory

on:
  workflow_dispatch:
  push:
    paths:
      - 'quarry/raw/alpacka-ai/surface/root-links.jsonl'
      - '.github/prompt-directory-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build normalized prompt directory
        run: |
          python tools/build_prompt_directory.py \
            quarry/raw/alpacka-ai/surface/root-links.jsonl \
            --output quarry/normalized/alpacka-ai-public-prompt-directory.jsonl \
            --manifest quarry/normalized/alpacka-ai-public-prompt-directory-manifest.json
      - name: Commit directory
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add quarry/normalized/alpacka-ai-public-prompt-directory.jsonl quarry/normalized/alpacka-ai-public-prompt-directory-manifest.json
          if git diff --cached --quiet; then
            echo 'No prompt directory changes to commit.'
            exit 0
          fi
          git commit -m 'data: build Alpacka public prompt directory'
          git pull --rebase origin main
          git push origin HEAD:main
