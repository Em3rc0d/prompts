name: Validate Starter Code Review Edition v1

on:
  push:
    branches:
      - feat/workflow-kits-product-model-20260902
    paths:
      - 'product/starter-code-review-edition-v1/**'
      - 'product/starter-collection-v2/workflows/evidence-first-code-review.md'
      - 'product/starter-collection-v2/workflows/evidence-first-code-review-v2-2-hardening.md'
      - 'product/starter-collection-v2/workflows/evidence-first-code-review-v2-2.surface.json'
      - 'certification/receipts/starter-code-review-v2.2-g11-certification.json'
      - 'commercial/STARTER_CODE_REVIEW_EDITION_RELEASE_PROFILE_V1.json'
      - 'commercial/STARTER_CODE_REVIEW_G10_HUMAN_VALUE_REVIEW_2026-09-07.json'
      - 'commercial/STARTER_N09_G09_MODEL_SPECIFIC_CLASSIFICATION_2026-09-07.json'
      - 'tools/build_starter_code_review_edition.py'
      - 'tools/validate_starter_code_review_edition.py'
      - '.github/workflows/validate-starter-code-review-edition-v1.yml'
  pull_request:
    paths:
      - 'product/starter-code-review-edition-v1/**'
      - 'product/starter-collection-v2/workflows/evidence-first-code-review.md'
      - 'product/starter-collection-v2/workflows/evidence-first-code-review-v2-2-hardening.md'
      - 'product/starter-collection-v2/workflows/evidence-first-code-review-v2-2.surface.json'
      - 'certification/receipts/starter-code-review-v2.2-g11-certification.json'
      - 'commercial/STARTER_CODE_REVIEW_EDITION_RELEASE_PROFILE_V1.json'
      - 'commercial/STARTER_CODE_REVIEW_G10_HUMAN_VALUE_REVIEW_2026-09-07.json'
      - 'commercial/STARTER_N09_G09_MODEL_SPECIFIC_CLASSIFICATION_2026-09-07.json'
      - 'tools/build_starter_code_review_edition.py'
      - 'tools/validate_starter_code_review_edition.py'
      - '.github/workflows/validate-starter-code-review-edition-v1.yml'
  workflow_dispatch:

jobs:
  deterministic-build-and-pack-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build final artifact twice
        run: |
          set -euo pipefail
          python tools/build_starter_code_review_edition.py --out-dir /tmp/pm-starter-cr-build-1 | tee /tmp/build-1.stdout.json
          python tools/build_starter_code_review_edition.py --out-dir /tmp/pm-starter-cr-build-2 | tee /tmp/build-2.stdout.json

      - name: Verify byte-for-byte determinism
        run: |
          set -euo pipefail
          cmp \
            /tmp/pm-starter-cr-build-1/prompt-machine-starter-code-review-edition-v1.0.0.zip \
            /tmp/pm-starter-cr-build-2/prompt-machine-starter-code-review-edition-v1.0.0.zip
          cmp \
            /tmp/pm-starter-cr-build-1/build-receipt.json \
            /tmp/pm-starter-cr-build-2/build-receipt.json
          sha256sum \
            /tmp/pm-starter-cr-build-1/prompt-machine-starter-code-review-edition-v1.0.0.zip \
            /tmp/pm-starter-cr-build-2/prompt-machine-starter-code-review-edition-v1.0.0.zip

      - name: Run independent pack QA on both builds
        id: qa
        shell: bash
        run: |
          set +e
          set -o pipefail
          python tools/validate_starter_code_review_edition.py \
            --archive /tmp/pm-starter-cr-build-1/prompt-machine-starter-code-review-edition-v1.0.0.zip \
            | tee /tmp/pm-starter-cr-build-1/pack-qa.json
          build1=${PIPESTATUS[0]}
          python tools/validate_starter_code_review_edition.py \
            --archive /tmp/pm-starter-cr-build-2/prompt-machine-starter-code-review-edition-v1.0.0.zip \
            | tee /tmp/pm-starter-cr-build-2/pack-qa.json
          build2=${PIPESTATUS[0]}
          cmp /tmp/pm-starter-cr-build-1/pack-qa.json /tmp/pm-starter-cr-build-2/pack-qa.json
          cmp_rc=$?
          printf '%s %s %s\n' "$build1" "$build2" "$cmp_rc" > /tmp/pm-starter-cr-qa-status.txt
          exit 0

      - name: Show canonical build evidence
        if: always()
        run: |
          set -euo pipefail
          cat /tmp/pm-starter-cr-build-1/build-receipt.json
          cat /tmp/pm-starter-cr-build-1/pack-qa.json
          cat /tmp/pm-starter-cr-qa-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-machine-starter-code-review-edition-v1.0.0
          path: |
            /tmp/pm-starter-cr-build-1/prompt-machine-starter-code-review-edition-v1.0.0.zip
            /tmp/pm-starter-cr-build-1/build-receipt.json
            /tmp/pm-starter-cr-build-1/pack-qa.json
            /tmp/pm-starter-cr-qa-status.txt
          if-no-files-found: error

      - name: Enforce pack QA verdict
        run: |
          set -euo pipefail
          read -r build1 build2 cmp_rc < /tmp/pm-starter-cr-qa-status.txt
          test "$build1" = "0"
          test "$build2" = "0"
          test "$cmp_rc" = "0"
