name: Validate MK1 F4

on:
  workflow_dispatch:
  push:
    paths:
      - 'mk1/specs/F4_BEHAVIORAL_TESTING.md'
      - 'mk1/specs/F4_HUMAN_REVIEW_PROTOCOL.md'
      - 'mk1/fixtures/f4/**'
      - 'mk1/receipts/f4/**'
      - 'mk1/candidates/f4/**'
      - 'quarry/fixtures/alpacka-free-golden-fixtures.json'
      - 'quarry/fixtures/alpacka-free-golden-fixtures-manifest.json'
      - 'tools/mk1_behavioral_runner.py'
      - 'tools/mk1_prepare_f4_execution.py'
      - 'tools/mk1_promote_tested.py'
      - 'tools/mk1_materialize_f4_tested.py'
      - 'tools/validate_mk1_f4_repository.py'
      - 'tools/validate_mk1_fixture_provenance.py'
      - 'tools/test_mk1_f4.py'
      - '.github/workflows/validate-mk1-f4.yml'
      - '.github/workflows/build-mk1-f4-tested.yml'

permissions:
  contents: read

jobs:
  validate-f4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate canonical quarry
        run: python tools/validate_catalog.py

      - name: Re-run F1 guardrails
        run: python tools/test_mk1_f1.py

      - name: Re-run F2 assembler characterization
        run: python tools/test_mk1_f2.py

      - name: Re-run F3 semantic critic characterization
        run: python tools/test_mk1_f3.py

      - name: Validate MK0 to MK1 fixture provenance
        run: python tools/validate_mk1_fixture_provenance.py

      - name: Characterize F4 behavioral harness
        run: python tools/test_mk1_f4.py

      - name: Validate persisted F4 evidence boundary
        run: python tools/validate_mk1_f4_repository.py
