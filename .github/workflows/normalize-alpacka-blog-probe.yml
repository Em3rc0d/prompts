name: Normalize Alpacka Blog Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/blog-normalization-trigger'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Normalize blog probe
        run: |
          python tools/normalize_blog_probe.py \
            quarry/fixtures/alpacka-blog-dynamic-probe.json \
            --output quarry/normalized/alpacka-ai-blog-articles.jsonl \
            --manifest quarry/normalized/alpacka-ai-blog-articles-manifest.json

      - name: Validate quarry
        run: python tools/validate_catalog.py

      - name: Commit normalized blog records
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add quarry/normalized/alpacka-ai-blog-articles.jsonl quarry/normalized/alpacka-ai-blog-articles-manifest.json
          if git diff --cached --quiet; then
            echo 'No normalized blog changes to commit.'
            exit 0
          fi
          git commit -m 'data: normalize Alpacka blog article metadata'
          git pull --rebase origin main
          python tools/validate_catalog.py
          git push origin HEAD:main
