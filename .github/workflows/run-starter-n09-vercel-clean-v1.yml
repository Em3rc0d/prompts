name: Run Starter N09 Vercel Clean Retest v1

on:
  push:
    branches:
      - feat/workflow-kits-product-model-20260902
    paths:
      - '.github/starter-n09-vercel-trigger-v1'

permissions:
  contents: read

concurrency:
  group: starter-n09-vercel-clean-v1
  cancel-in-progress: false

jobs:
  one-clean-runtime-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_FTC62CRbJz9veMUDYeVzf7yI
      VERCEL_PROJECT_ID: prj_Srr2nUKq8fZWff6x9XMyrY3dkjJ7
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CASE_ID: PM-STARTER-CR-NORMAL-0001
      EXPECTED_ENVELOPE_SHA256: d8572fb1731242224cf76520ebfd1fdcbe496964205837613c02a24af7d9c207
      MODEL_ID: openai/gpt-5.6-sol

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Fail closed on authorization or trigger drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          auth = json.loads(Path('commercial/STARTER_N09_RUNTIME_AUTHORIZATION_V1.json').read_text(encoding='utf-8'))
          assert auth['case_id'] == 'PM-STARTER-CR-NORMAL-0001', auth
          assert auth['maximum_executions'] == 1, auth
          assert auth['maximum_retries'] == 0, auth
          assert auth['automatic_second_case'] is False, auth
          assert auth['required_runtime_envelope_sha256'] == 'd8572fb1731242224cf76520ebfd1fdcbe496964205837613c02a24af7d9c207', auth
          assert auth['authorized_surface'] == 'VERCEL_AI_GATEWAY_PREVIEW', auth
          assert auth['authorized_model'] == 'openai/gpt-5.6-sol', auth
          assert auth['state'] == 'AUTHORIZED_NOT_YET_CONSUMED', auth

          trigger = Path('.github/starter-n09-vercel-trigger-v1').read_text(encoding='utf-8').strip().splitlines()
          expected = [
              'case_id=PM-STARTER-CR-NORMAL-0001',
              'maximum_executions=1',
              'maximum_retries=0',
              'surface=VERCEL_AI_GATEWAY_PREVIEW',
              'model=openai/gpt-5.6-sol',
              'execute=true',
          ]
          assert trigger == expected, (trigger, expected)
          print('N09 AUTHORIZATION + TRIGGER GATE: PASS')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify exact frozen runtime envelope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/n09-envelope
          python tools/build_starter_canary_envelopes_v1.py \
            --output-dir build/n09-envelope \
            --verify-reproducible

          ENVELOPE='build/n09-envelope/final/PM-STARTER-CR-NORMAL-0001.runtime-envelope.txt'
          test -f "$ENVELOPE"
          test "$(wc -c < "$ENVELOPE" | tr -d ' ')" = '8100'
          ACTUAL_SHA="$(sha256sum "$ENVELOPE" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_ENVELOPE_SHA256"

          B64="$(base64 -w0 "$ENVELOPE")"
          echo "N09_RUNTIME_ENVELOPE_B64=$B64" >> "$GITHUB_ENV"
          echo 'N09 EXACT ENVELOPE GATE: PASS — 8100 bytes / expected SHA-256'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package.json

      - name: Fail closed unless Vercel credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'N09 VERCEL SURFACE: BLOCKED — VERCEL_TOKEN missing. No model call made.' >&2
            exit 1
          fi

      - name: Link only the staging Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > web/.vercel/project.json

      - name: Validate web surface before deployment
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Generate one-time execution token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "N09_EXECUTION_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy isolated preview execution surface
        id: deploy
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes vercel@latest deploy \
            --yes \
            --project "$VERCEL_PROJECT_ID" \
            -T "$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN" \
            --env N09_EXECUTION_TOKEN="$N09_EXECUTION_TOKEN" \
            --env N09_RUNTIME_ENVELOPE_B64="$N09_RUNTIME_ENVELOPE_B64" \
            --env N09_MODEL="$MODEL_ID")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "N09 isolated preview deployed: $DEPLOYMENT_URL"

      - name: Execute exactly one N09 surface submission
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/n09-vercel-evidence
          DEPLOYMENT_URL='${{ steps.deploy.outputs.url }}'

          HTTP_STATUS="$(curl --silent --show-error \
            --output build/n09-vercel-evidence/raw-surface-response.json \
            --write-out '%{http_code}' \
            -X POST "$DEPLOYMENT_URL/api/n09-clean-retest" \
            -H "authorization: Bearer $N09_EXECUTION_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"case_id":"PM-STARTER-CR-NORMAL-0001"}')"

          echo "$HTTP_STATUS" > build/n09-vercel-evidence/http-status.txt
          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          echo "N09 surface submission completed with HTTP $HTTP_STATUS"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('build/n09-vercel-evidence')
          status = int((root / 'http-status.txt').read_text().strip())
          raw = (root / 'raw-surface-response.json').read_text(encoding='utf-8')
          try:
              payload = json.loads(raw)
          except Exception:
              payload = None

          observed = bool(status == 200 and isinstance(payload, dict) and payload.get('ok') is True)
          manifest = {
              'schema': 'prompt-machine-starter-n09-vercel-runtime-evidence-v1',
              'case_id': 'PM-STARTER-CR-NORMAL-0001',
              'execution_surface': 'VERCEL_AI_GATEWAY_PREVIEW',
              'source_commit': os.environ['GITHUB_SHA'],
              'runtime_envelope_bytes': 8100,
              'runtime_envelope_sha256': os.environ['EXPECTED_ENVELOPE_SHA256'],
              'model_requested': os.environ['MODEL_ID'],
              'surface_submissions': 1,
              'automatic_retries': 0,
              'automatic_second_case': False,
              'http_status': status,
              'behavioral_observation_created': observed,
              'human_review_required': True,
              'trust_history_updated_automatically': False,
              'release_gate_updated_automatically': False,
              'public_copy_updated_automatically': False,
          }
          (root / 'runtime-evidence-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Preserve raw N09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PM-STARTER-CR-NORMAL-0001-N09-VERCEL-CLEAN
          path: build/n09-vercel-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce human-review stop-line
        shell: bash
        run: |
          set -euo pipefail
          STATUS='${{ steps.execute.outputs.http_status }}'
          if [ "$STATUS" != '200' ]; then
            echo "N09 CLEAN RETEST: execution surface returned HTTP $STATUS after exactly one submission. No retry is permitted." >&2
            exit 1
          fi
          echo 'N09 CLEAN RETEST: REAL OBSERVATION CAPTURED / HUMAN REVIEW REQUIRED'
          echo 'No second case, retry, Trust History update, release promotion, or public claim is permitted by this workflow.'
