name: Test Commercial Web v0

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mk1-prompt-generator-v0-20260827
    paths:
      - 'web/**'
      - 'tools/test_commercial_web_v0.py'
      - '.github/workflows/test-commercial-web-v0.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tools/test_commercial_web_v0.py'
      - '.github/workflows/test-commercial-web-v0.yml'

permissions:
  contents: read

jobs:
  static-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile web acceptance tooling
        run: python -m py_compile tools/test_commercial_web_v0.py
      - name: Validate commercial landing
        run: python tools/test_commercial_web_v0.py
