name: Build MK0 Human Review Queue

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mk1-prompt-generator-v0-20260827
    paths:
      - tools/mk0_build_human_review_queue.py
      - mk0/golden-dataset/candidate-queue/batch-001.jsonl
      - mk0/harvester/HUMAN_REVIEW.schema.json
      - .github/workflows/build-mk0-human-review-queue.yml

permissions:
  contents: write

jobs:
  build-review-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build prioritized human review queue
        run: python tools/mk0_build_human_review_queue.py
      - name: Enforce queue invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('mk0/analysis/harvester/human-review-queue-batch-001.json').read_text())
          assert summary['status']=='PASS'
          assert summary['records']==79, summary
          assert sum(summary['priority_buckets'].values())==79, summary
          assert len(summary['first_review_set'])==10, summary
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit queue artifacts
        run: |
          git config user.name "prompt-quarry-bot"
          git config user.email "prompt-quarry-bot@users.noreply.github.com"
          git add mk0/golden-dataset/human-review-queue mk0/analysis/harvester/human-review-queue-batch-001.json
          if git diff --cached --quiet; then
            echo "No review queue changes"
          else
            git commit -m "data(mk0): build human review queue batch 001"
            git push
          fi
