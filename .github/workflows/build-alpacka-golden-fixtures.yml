name: Build Alpacka Golden Fixtures

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/golden-fixture-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build golden fixtures
        run: |
          python tools/build_golden_fixtures.py \
            quarry/analysis/alpacka-ai-free-technique-vectors.jsonl \
            --output quarry/fixtures/alpacka-free-golden-fixtures.json \
            --manifest quarry/fixtures/alpacka-free-golden-fixtures-manifest.json

      - name: Validate quarry
        run: python tools/validate_catalog.py

      - name: Commit golden fixtures
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add quarry/fixtures/alpacka-free-golden-fixtures.json quarry/fixtures/alpacka-free-golden-fixtures-manifest.json
          if git diff --cached --quiet; then
            echo 'No golden-fixture changes to commit.'
            exit 0
          fi
          git commit -m 'data: build Alpacka free golden fixtures'
          git pull --rebase origin main
          python tools/validate_catalog.py
          git push origin HEAD:main
