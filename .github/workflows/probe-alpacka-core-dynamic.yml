name: Probe Alpacka Core Dynamic Surface

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/core-dynamic-probe-trigger'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Probe public core data contracts
        run: |
          python tools/probe_dynamic_pages.py \
            'https://www.alpackaai.xyz/' \
            'https://www.alpackaai.xyz/skills' \
            'https://www.alpackaai.xyz/generador' \
            --output quarry/fixtures/alpacka-core-dynamic-probe.json

      - name: Validate quarry
        run: python tools/validate_catalog.py

      - name: Commit sanitized core probe
        shell: bash
        run: |
          git config user.name 'prompt-quarry-bot'
          git config user.email 'prompt-quarry-bot@users.noreply.github.com'
          git add quarry/fixtures/alpacka-core-dynamic-probe.json
          if git diff --cached --quiet; then
            echo 'No core dynamic-probe changes to commit.'
            exit 0
          fi
          git commit -m 'data: probe Alpacka public core data contracts'
          git pull --rebase origin main
          python tools/validate_catalog.py
          git push origin HEAD:main
