name: Validate MK1 F1

on:
  push:
    branches: [main]
    paths:
      - 'mk1/**'
      - 'tools/mk1_*.py'
      - 'tools/test_mk1_f1.py'
      - '.github/workflows/validate-mk1-f1.yml'
  pull_request:
    paths:
      - 'mk1/**'
      - 'tools/mk1_*.py'
      - 'tools/test_mk1_f1.py'

jobs:
  validate-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate canonical quarry
        run: python tools/validate_catalog.py
      - name: Run MK1 F1 characterization tests
        run: python tools/test_mk1_f1.py
