name: Validate MK1 F2

on:
  push:
    branches: [main]
    paths:
      - 'mk1/briefs/**'
      - 'mk1/candidates/**'
      - 'mk1/specs/**'
      - 'tools/mk1_candidate_assembler.py'
      - 'tools/mk1_architecture_selector.py'
      - 'tools/mk1_prompt_linter.py'
      - 'tools/test_mk1_f2.py'
      - '.github/workflows/validate-mk1-f2.yml'
  pull_request:
    paths:
      - 'mk1/briefs/**'
      - 'mk1/candidates/**'
      - 'mk1/specs/**'
      - 'tools/mk1_candidate_assembler.py'
      - 'tools/mk1_architecture_selector.py'
      - 'tools/mk1_prompt_linter.py'
      - 'tools/test_mk1_f2.py'

jobs:
  validate-f2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate canonical quarry
        run: python tools/validate_catalog.py
      - name: Re-run MK1 F1 characterization
        run: python tools/test_mk1_f1.py
      - name: Run MK1 F2 candidate assembler characterization
        run: python tools/test_mk1_f2.py
