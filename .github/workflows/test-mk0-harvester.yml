name: Test MK0 Harvester

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mk1-prompt-generator-v0-20260827
    paths:
      - mk0/harvester/**
      - tools/mk0_harvester_router.py
      - tools/test_mk0_harvester_router.py
      - mk0/MANIFEST.json
      - .github/workflows/test-mk0-harvester.yml

jobs:
  harvester-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Harvester tooling
        run: |
          python -m py_compile tools/mk0_harvester_router.py tools/test_mk0_harvester_router.py

      - name: Validate policy JSON
        run: |
          python -m json.tool mk0/harvester/POLICY.json >/dev/null
          python -m json.tool mk0/harvester/SOURCE_RECORD.schema.json >/dev/null
          python -m json.tool mk0/harvester/CANDIDATE_RECORD.schema.json >/dev/null
          python -m json.tool mk0/harvester/HUMAN_REVIEW.schema.json >/dev/null

      - name: Run routing boundary tests
        env:
          PYTHONPATH: tools
        run: python tools/test_mk0_harvester_router.py
