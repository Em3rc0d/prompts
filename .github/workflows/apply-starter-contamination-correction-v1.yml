name: Apply Starter Runtime Contamination Correction v1

on:
  push:
    branches:
      - feat/workflow-kits-product-model-20260902
    paths:
      - '.github/starter-contamination-correction-trigger'

permissions:
  contents: write

jobs:
  apply-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/workflow-kits-product-model-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply append-only correction
        run: python tools/apply_starter_runtime_contamination_correction_v1.py

      - name: Make validator migration idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/patch_starter_contamination_validators_v1.py')
          t = p.read_text(encoding='utf-8')
          old = '''def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise AssertionError(f"missing expected legacy assertion: {label}: {old}")
              return text.replace(old, new)
          '''
          new = '''def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new)
              if new in text:
                  return text
              raise AssertionError(f"missing both legacy and corrected assertion: {label}")
          '''
          if old not in t and new not in t:
              raise SystemExit('replace_required helper shape drifted')
          p.write_text(t.replace(old, new), encoding='utf-8')
          PY

      - name: Patch validators for corrected effective state
        run: python tools/patch_starter_contamination_validators_v1.py

      - name: Validate corrected release gate
        run: python tools/validate_starter_release_gate_v1.py

      - name: Validate corrected release DAG
        run: python tools/validate_starter_release_dag_v1.py

      - name: Validate corrected launch checkpoint
        run: python tools/validate_starter_launch_checkpoint_v1.py

      - name: Validate execution decision governance
        run: python tools/validate_starter_execution_decisions_v1.py

      - name: Validate Trust History governance
        run: python tools/validate_trust_history_v1.py

      - name: Commit correction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commercial product tools .github/workflows/validate-starter-release-gate-v1.yml
          git commit -m "fix(starter): reclassify contaminated canary as inconclusive"
          git push origin HEAD:feat/workflow-kits-product-model-20260902
